[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "densely-packed-cylinders"
version = "0.1.0"
description = "Python wrapper for the Donev C++ packing algorithm"
requires-python = ">=3.12.9"
dependencies = [
    "numpy>=2.5.1",
    "scipy>=1.18.0",
    "matplotlib>=3.11.1",
]

[project.scripts]
densely-packed-cylinders = "densely_packed_cylinders.__main__:main"

[tool.setuptools.packages.find]
include = ["densely_packed_cylinders*"]